[package]
name = "airlock-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri backend application for Airlock DevSecOps Operations Cockpit"

[dependencies]
airlock-core = { path = "../crates/airlock-core" }
airlock-k8s = { path = "../crates/airlock-k8s" }
airlock-prom = { path = "../crates/airlock-prom" }
airlock-pty = { path = "../crates/airlock-pty" }
airlock-ai = { path = "../crates/airlock-ai" }
airlock-api = { package = "airlock-cli", path = "../crates/airlock-cli" }
tauri = { version = "1.6", features = ["window-all"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs = "5.0"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
